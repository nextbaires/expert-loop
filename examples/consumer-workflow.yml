# Copy this into a consuming repository as .github/workflows/expert-loop.yml
#
# The label gate is the security boundary. Proposals arrive from strangers, and the
# issue body becomes input to an assistant with write access to a branch. Anyone can
# file an issue; only someone with write access can apply a label. So nothing runs
# until a maintainer has read the proposal and applied `approved-for-drafting`.
#
# Do not change the trigger to `issues: [opened]`. That would let any account on the
# internet start a billed agent run against your repository.

name: Expert loop

on:
  issues:
    types: [labeled]

jobs:
  draft:
    # Only the gate label, and only on proposals.
    if: >
      github.event.label.name == 'approved-for-drafting' &&
      contains(github.event.issue.labels.*.name, 'proposal')
    uses: nextbaires/expert-loop/.github/workflows/expert-loop.yml@v1
    with:
      domain: seismology
      allowed-paths: "baselines/ bench/ ingest/ tests/ docs/"
      test-command: "pytest -q"
      # claude-opus-5 is the default. Switch to claude-sonnet-5 for mechanical changes.
      model: claude-opus-5
      max-turns: 40
      # A cheap Haiku pass decides whether the proposal is actionable before the
      # expensive drafting run reads your whole codebase. Leave this on.
      triage: true
    secrets:
      # Pick ONE.
      #
      # Subscription (recommended): no per-token charge, drawn against your Claude
      # plan's limits instead. Generate the token with `claude setup-token` and add
      # it as a repository secret.
      claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      #
      # Pay per token: use this instead if you have no Claude subscription, or if
      # you want this loop's spend to appear separately on an API bill.
      # anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
